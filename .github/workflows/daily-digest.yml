name: Daily Digest Push

on:
  schedule:
    # 09:00 台灣 = 01:00 UTC
    - cron: '0 1 * * *'    # Claude Code 更新 (台灣 09:00)

  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to push'
        required: true
        default: 'claude-code'
        type: choice
        options:
          - claude-code

jobs:
  push-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run domain digest
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python domain_digest.py claude-code

      - name: Summary
        run: |
          echo "### Daily Digest Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Domain: claude-code" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Success" >> $GITHUB_STEP_SUMMARY
