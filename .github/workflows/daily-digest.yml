name: Daily Digest Push

on:
  schedule:
    - cron: '0 1 * * *'    # 09:00 TW — Claude Code 更新 + Inbox 推播

  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - claude-code
          - inbox

jobs:
  push-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Claude Code digest
        if: ${{ github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'claude-code' }}
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python domain_digest.py claude-code

      - name: Run Inbox digest
        if: ${{ github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'inbox' }}
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python daily_digest.py

      - name: Persist sent releases
        if: ${{ github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'claude-code' }}
        run: |
          if git diff --quiet scripts/data/sent_releases.json 2>/dev/null; then
            echo "No new releases to persist"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/data/sent_releases.json
            git commit -m "[Bot] Update sent_releases.json"
            git push
          fi

      - name: Summary
        run: |
          echo "### Daily Digest Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Task: ${{ inputs.task || 'all (scheduled)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Success" >> $GITHUB_STEP_SUMMARY
