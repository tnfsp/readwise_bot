name: Daily Digest Push

on:
  schedule:
    - cron: '0 1 * * *'    # 09:00 TW — Claude Code 更新 + Inbox 推播

  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - claude-code
          - inbox

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  push-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        if: ${{ github.event_name == 'schedule' }}
        id: dedup
        run: |
          # Check last commit by bot — if today, skip
          LAST_BOT=$(git log --all --author="github-actions" --format="%aI" -1 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$LAST_BOT" == "$TODAY"* ]]; then
            echo "Already ran today ($LAST_BOT), skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Claude Code digest
        if: ${{ steps.dedup.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'claude-code') }}
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python domain_digest.py claude-code

      - name: Run Inbox digest
        if: ${{ steps.dedup.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'inbox') }}
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python daily_digest.py

      - name: Persist sent releases
        if: ${{ steps.dedup.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'claude-code') }}
        run: |
          if git diff --quiet scripts/data/sent_releases.json 2>/dev/null; then
            echo "No new releases to persist"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/data/sent_releases.json
            git commit -m "[Bot] Update sent_releases.json"
            git push
          fi

      - name: Summary
        run: |
          if [[ "${{ steps.dedup.outputs.skip }}" == "true" ]]; then
            echo "### Daily Digest — Skipped (already ran today)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Daily Digest Summary" >> $GITHUB_STEP_SUMMARY
            echo "- Task: ${{ inputs.task || 'all (scheduled)' }}" >> $GITHUB_STEP_SUMMARY
            echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
            echo "- Status: Success" >> $GITHUB_STEP_SUMMARY
          fi
