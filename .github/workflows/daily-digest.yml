name: Claude Code Release Tracker

on:
  schedule:
    - cron: '0 1 * * *'    # 09:00 TW

  workflow_dispatch:

concurrency:
  group: release-tracker
  cancel-in-progress: false

jobs:
  track-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        if: ${{ github.event_name == 'schedule' }}
        id: dedup
        run: |
          LAST_BOT=$(git log --all --author="github-actions" --format="%aI" -1 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$LAST_BOT" == "$TODAY"* ]]; then
            echo "Already ran today ($LAST_BOT), skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Claude Code release tracker
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          python domain_digest.py claude-code

      - name: Persist sent releases
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          if git diff --quiet scripts/data/sent_releases.json 2>/dev/null; then
            echo "No new releases to persist"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/data/sent_releases.json
            git commit -m "[Bot] Update sent_releases.json"
            git pull --rebase origin master
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ Release Tracker 執行失敗%0A時間：$(date -u +%Y-%m-%dT%H:%M:%SZ)%0ARun：${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}"
